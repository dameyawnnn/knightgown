<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Metadata Cleaner</title>
<style>
  body{
    font-family:-apple-system, sans-serif;
    max-width:600px;
    margin:40px auto;
    padding:0 20px;
    background:#111;
    color:#eee;
  }
  h2{font-size:20px;}
  input[type=file]{
    width:100%;
    padding:14px;
    font-size:14px;
    margin:14px 0;
    border:1px dashed #555;
    background:#1c1c1c;
    color:#eee;
    box-sizing:border-box;
  }
  button{
    width:100%;
    padding:14px;
    font-size:14px;
    background:#8a3327;
    color:#fff;
    border:none;
    cursor:pointer;
    margin-top:10px;
  }
  button:disabled{ background:#555; }
  pre{
    background:#1c1c1c;
    padding:14px;
    font-size:12px;
    overflow-x:auto;
    white-space:pre-wrap;
    word-break:break-all;
    border:1px solid #333;
  }
  .status{ font-size:13px; color:#aaa; margin:10px 0; }
  .ok{ color:#7bbf7b; }
  .err{ color:#e08a7d; }
</style>
</head>
<body>

<h2>GLB Metadata Cleaner</h2>
<p style="color:#aaa; font-size:13px;">Pick your .glb file straight from your device — nothing is uploaded anywhere, it's all processed right here in your browser. This strips the "Tripo" generator tag and renames any tripo_-prefixed mesh/material/node names.</p>

<input type="file" id="fileInput" accept=".glb">

<div class="status" id="status"></div>
<pre id="before" style="display:none;"></pre>
<button id="cleanBtn" style="display:none;">Clean &amp; Download</button>

<script>
const statusEl = document.getElementById('status');
const beforeEl = document.getElementById('before');
const cleanBtn = document.getElementById('cleanBtn');
let currentJson = null;
let currentBinChunk = null;
let filenameGuess = 'model-cleaned.glb';

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (cls || '');
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  filenameGuess = file.name || 'model-cleaned.glb';
  setStatus('Reading file…');
  beforeEl.style.display = 'none';
  cleanBtn.style.display = 'none';

  try {
    const buf = await file.arrayBuffer();
    const dv = new DataView(buf);
    const magic = dv.getUint32(0, true);
    if (magic !== 0x46546C67) throw new Error('Not a valid GLB file (bad magic number).');

    let offset = 12;
    let jsonChunk = null, binChunk = null;
    while (offset < buf.byteLength) {
      const chunkLen = dv.getUint32(offset, true);
      const chunkType = dv.getUint32(offset + 4, true);
      const chunkData = buf.slice(offset + 8, offset + 8 + chunkLen);
      if (chunkType === 0x4E4F534A) jsonChunk = chunkData; // 'JSON'
      if (chunkType === 0x004E4942) binChunk = chunkData;  // 'BIN\0'
      offset += 8 + chunkLen;
    }
    if (!jsonChunk) throw new Error('No JSON chunk found.');

    const jsonText = new TextDecoder().decode(jsonChunk);
    const json = JSON.parse(jsonText);
    currentJson = json;
    currentBinChunk = binChunk;

    let found = [];
    if (json.asset && json.asset.generator) found.push('generator: ' + json.asset.generator);
    ['meshes','materials','images','nodes','scenes'].forEach(key => {
      (json[key] || []).forEach(item => {
        if (item.name && /tripo/i.test(item.name)) found.push(key + '.name: ' + item.name);
      });
    });

    beforeEl.style.display = 'block';
    beforeEl.textContent = found.length
      ? 'Found:\n' + found.join('\n')
      : 'No Tripo references found in metadata — file may already be clean.';
    setStatus('Loaded successfully (' + (buf.byteLength/1e6).toFixed(2) + ' MB).', 'ok');
    cleanBtn.style.display = 'block';

  } catch (err) {
    setStatus('Error: ' + err.message, 'err');
    console.error(err);
  }
});

cleanBtn.addEventListener('click', () => {
  if (!currentJson) return;
  const json = JSON.parse(JSON.stringify(currentJson)); // deep clone

  if (json.asset) json.asset.generator = 'Knight Gown Studio';
  ['meshes','materials','images','nodes','scenes'].forEach(key => {
    (json[key] || []).forEach(item => {
      if (item.name) item.name = item.name.replace(/tripo[_-]?/gi, 'knight_gown_');
    });
  });

  let jsonStr = JSON.stringify(json);
  // pad JSON chunk to 4-byte boundary with spaces per glTF spec
  while (jsonStr.length % 4 !== 0) jsonStr += ' ';
  const jsonBytes = new TextEncoder().encode(jsonStr);

  const chunks = [];
  const jsonHeader = new ArrayBuffer(8);
  new DataView(jsonHeader).setUint32(0, jsonBytes.byteLength, true);
  new DataView(jsonHeader).setUint32(4, 0x4E4F534A, true);
  chunks.push(jsonHeader, jsonBytes.buffer);

  let totalLen = 12 + 8 + jsonBytes.byteLength;

  if (currentBinChunk) {
    let binLen = currentBinChunk.byteLength;
    let padded = currentBinChunk;
    if (binLen % 4 !== 0) {
      const pad = 4 - (binLen % 4);
      const padded_arr = new Uint8Array(binLen + pad);
      padded_arr.set(new Uint8Array(currentBinChunk));
      padded = padded_arr.buffer;
      binLen = padded.byteLength;
    }
    const binHeader = new ArrayBuffer(8);
    new DataView(binHeader).setUint32(0, binLen, true);
    new DataView(binHeader).setUint32(4, 0x004E4942, true);
    chunks.push(binHeader, padded);
    totalLen += 8 + binLen;
  }

  const glbHeader = new ArrayBuffer(12);
  const hv = new DataView(glbHeader);
  hv.setUint32(0, 0x46546C67, true);
  hv.setUint32(4, 2, true);
  hv.setUint32(8, totalLen, true);

  const outName = filenameGuess.replace('.glb', '') + '-cleaned.glb';
  const blob = new Blob([glbHeader, ...chunks], { type: 'model/gltf-binary' });

  // iOS Safari doesn't reliably support blob-link downloads — try native
  // Share Sheet first (works for saving to Files there), fall back to
  // the classic download-link approach for other browsers.
  const file = new File([blob], outName, { type: 'model/gltf-binary' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: outName })
      .then(() => setStatus('Choose "Save to Files" in the share sheet to keep it.', 'ok'))
      .catch((err) => {
        if (err.name !== 'AbortError') {
          setStatus('Share failed: ' + err.message + ' — trying direct download instead.', 'err');
          triggerDownload();
        }
      });
  } else {
    triggerDownload();
  }

  function triggerDownload() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = outName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus('Cleaned file downloaded — check your Downloads/Files.', 'ok');
  }
});
</script>

</body>
</html>
